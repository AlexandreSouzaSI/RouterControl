<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classificar pagamentos sem placa · Set/2026</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb;
  --accent:#2563eb;--ok:#059669;--warn:#d97706;--bad:#dc2626;--sel:#eff6ff;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#171a21;--ink:#e8eaed;--muted:#9aa1ad;--line:#2a2f3a;--soft:#1d212a;
  --accent:#60a5fa;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--sel:#1e2a44;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px 10px}
h1{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.acoes{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.prog{height:6px;background:var(--line);border-radius:4px;margin:10px 0 10px;overflow:hidden}
.prog>div{height:100%;background:var(--ok);transition:width .25s}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cardt{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,#999);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0}
.cardt.ativo{outline:2px solid var(--accent)}
.cardt .n{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.cardt .n small{font-weight:500;color:var(--muted)}
.cardt .v{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardt .d{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cardt.pend{--c:var(--warn)}
main{padding:14px 20px 80px;max-width:1300px;margin:0 auto}
.filtros{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.filtros input{flex:1;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.dica{font-size:12px;color:var(--muted);margin:0 0 10px}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--card)}
.lin{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:28px 78px 1fr 130px;gap:10px;align-items:start}
.lin.foco{border-color:var(--accent);background:var(--sel);box-shadow:0 0 0 1px var(--accent)}
.lin.feito{opacity:.92}
.lin .i{color:var(--muted);font-size:12px;padding-top:2px}
.lin .dt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lin .nm{font-weight:600}
.lin .ds{color:var(--muted);font-size:12.5px;margin-top:1px;word-break:break-word}
.lin .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.btns{grid-column:3/5;display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.pl{padding:4px 9px;font-size:12.5px;font-weight:700;border-radius:7px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.pl .k{font-weight:500;color:var(--muted);font-size:10.5px;margin-left:3px}
.pl.on{background:var(--c);border-color:var(--c);color:#fff}
.pl.on .k{color:#ffffffb0}
.pl.outro{font-weight:600}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
select.car{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink)}
.res{grid-column:3/5;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;color:#fff;background:var(--c);font-weight:700;font-size:12px}
.sug{font-size:12px;color:var(--accent);background:none;border:1px dashed var(--accent);padding:3px 8px}
.nota{grid-column:3/5;width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--soft);color:var(--ink);font:inherit;font-size:12.5px}
.vazio{text-align:center;color:var(--muted);padding:40px}
/* modal dividir */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mod{background:var(--card);border-radius:12px;width:min(460px,100%);padding:16px;max-height:90vh;overflow:auto}
.mod h3{margin:0 0 4px;font-size:15px}
.mod .lr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.mod .lr label{flex:1;display:flex;gap:8px;align-items:center;font-weight:600}
.mod .lr input[type=text]{width:120px;text-align:right;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--soft);color:var(--ink);font:inherit}
.mod .rod{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.st{font-size:12.5px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
@media (max-width:700px){
  header{padding:10px 16px;position:static}main{padding:12px 16px 80px}
  .lin{grid-template-columns:1fr auto}.lin .i{display:none}.lin .dt{grid-column:1/3}
  .btns,.res,.nota{grid-column:1/3}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Pagamentos sem placa · Extrato Sicredi Pix · Setembro/2026</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="acoes">
      <button id="bSalvar" class="pri" title="Baixa um arquivo com a sua classificação, para continuar depois">💾 Salvar progresso</button>
      <button id="bAbrir" title="Carrega um progresso salvo">📂 Abrir progresso</button>
      <button id="bCsv">⬇ Exportar planilha (CSV)</button>
      <input type="file" id="fArq" accept=".json" hidden>
    </div>
  </div>
  <div class="prog"><div id="barra"></div></div>
  <div class="cards" id="cards"></div>
</header>
<main>
  <div class="filtros">
    <input id="busca" placeholder="Buscar por nome, descrição ou valor…">
    <div class="seg" id="seg">
      <button data-f="pend" class="on">Pendentes</button>
      <button data-f="todos">Todos</button>
      <button data-f="feitos">Classificados</button>
    </div>
  </div>
  <p class="dica">Clique no caminhão de cada pagamento. Atalhos no pagamento destacado: <kbd>1</kbd>–<kbd>8</kbd> caminhões, <kbd>G</kbd> geral/empresa, <kbd>N</kbd> não é despesa, <kbd>D</kbd> dividir, <kbd>S</kbd> aceitar sugestão, <kbd>0</kbd> limpar, <kbd>↑</kbd><kbd>↓</kbd> navegar. Clique num card para ver só os pagamentos dele.</p>
  <div id="lista"></div>
</main>
<div id="modal"></div>

const CONJ = [{"cav": "POZ", "placa": "POZ-6F28", "carretas": ["FQA-4231", "GJP-6400"], "motorista": "Giovanni dos Santos Godinho", "nomes": ["GIOVANNI", "GEOVANE", "GIOVANI"]}, {"cav": "QPM", "placa": "QPM-7278", "carretas": ["FQF-6321", "FQI-8702"], "motorista": "Flávio Gomes de Almeida", "nomes": ["FLAVIO"]}, {"cav": "RFX", "placa": "RFX-4H06", "carretas": ["EVO-4633", "SIO-8E70"], "motorista": "Israel Vieira da Silva", "nomes": ["ISRAEL"]}, {"cav": "RME", "placa": "RME-9B20", "carretas": ["EVU-9E78", "EVU-9E79", "EVU-9E80"], "motorista": "Roberto Ferreira de Souza", "nomes": ["ROBERTO"]}, {"cav": "SEV", "placa": "SEV-6G75", "carretas": ["FQM-4596", "FQL-0363"], "motorista": "Sérgio da Silva Ferreira", "nomes": ["SERGIO"]}, {"cav": "SEZ", "placa": "SEZ-8G61", "carretas": ["IRC-3A85", "IRC-3B39", "IRC-3B07"], "motorista": "João Batista Coelho", "nomes": ["JOAO BATISTA"]}, {"cav": "SYR", "placa": "SYR-4H04", "carretas": ["ASW-4C92", "ASW-4C94"], "motorista": "Gilson Alves da Silva", "nomes": ["GILSON"]}, {"cav": "TCF", "placa": "TCF-1D34", "carretas": ["ASX-7G23", "ASX-7G22"], "motorista": "Wallisson Tamietti de Siqueira", "nomes": ["WALLISSON"]}];  // [{cav, placa, carretas:[...], motorista, nomes:[...]}]
const CORES = ['#2563eb','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d'];
const EXTRA = {GERAL:{nome:'Geral / empresa',cor:'#475569',tecla:'G'}, NAO:{nome:'Não é despesa',cor:'#9ca3af',tecla:'N'}};
CONJ.forEach((c,i)=>c.cor=CORES[i%CORES.length]);
const cavDe = {}; CONJ.forEach(c=>{cavDe[c.cav]=c.cav; c.carretas.forEach(p=>cavDe[p]=c.cav);});
const corDe = k => (CONJ.find(c=>c.cav===cavDe[k])||{}).cor || (EXTRA[k]||{}).cor || '#999';
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = t => { t=String(t||'').trim(); if(!t) return 0; const n=Number(t.includes(',')?t.replace(/\./g,'').replace(',','.'):t); return isFinite(n)?n:0; };
const fmt = v => v.toFixed(2).replace('.',',');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();

// classificação: id -> {partes:[{k, v}], nota}
let cls = {};
let filtro='pend', cardFiltro=null, foco=0, mudou=false;

// sugestão por nome do motorista
DADOS.forEach(d=>{
  const t = norm(d.nome+' '+d.desc);
  const ach = CONJ.filter(c=>c.nomes.some(n=>new RegExp('\\b'+n+'\\b').test(t)));
  d.sug = ach.length===1 ? ach[0].cav : null;
  d.sugMot = ach.length===1 ? ach[0].motorista : null;
});

function partesDe(id){ return (cls[id]&&cls[id].partes)||[]; }
function setCls(id, partes){
  if(!partes||!partes.length){ if(cls[id]&&cls[id].nota){cls[id].partes=[];} else delete cls[id]; }
  else cls[id] = {...(cls[id]||{}), partes};
  mudou=true; render();
}

function totais(){
  const t={}; let feito=0, vFeito=0;
  CONJ.forEach(c=>t[c.cav]={tot:0,n:0,cav:0,car:{}});
  Object.keys(EXTRA).forEach(k=>t[k]={tot:0,n:0});
  DADOS.forEach(d=>{
    const ps=partesDe(d.id); if(!ps.length) return;
    feito++; vFeito+=d.v;
    ps.forEach(p=>{
      const g = cavDe[p.k] || p.k; const o=t[g]; o.tot+=p.v; o.n++;
      if(cavDe[p.k]){ if(p.k===g) o.cav+=p.v; else o.car[p.k]=(o.car[p.k]||0)+p.v; }
    });
  });
  return {t,feito,vFeito};
}

function render(){
  const {t,feito,vFeito} = totais();
  const total = DADOS.reduce((s,d)=>s+d.v,0);
  document.getElementById('sub').textContent =
    `${DADOS.length} pagamentos · ${brl(total)} · classificados ${feito} (${brl(vFeito)}) · faltam ${DADOS.length-feito} (${brl(total-vFeito)})`;
  document.getElementById('barra').style.width = (feito/DADOS.length*100)+'%';

  // cards
  let h = '';
  CONJ.forEach((c,i)=>{
    const o=t[c.cav]; const cars=Object.entries(o.car).map(([p,v])=>`${p} ${brl(v)}`).join(' · ');
    h += `<div class="cardt ${cardFiltro===c.cav?'ativo':''}" style="--c:${c.cor}" data-card="${c.cav}">
      <div class="n">${c.cav} <small>${i+1}</small></div>
      <div class="v">${brl(o.tot)}</div>
      <div class="d" title="${cars}">${o.n} lanç.${cars?' · carretas: '+cars:''}</div></div>`;
  });
  Object.entries(EXTRA).forEach(([k,e])=>{
    const o=t[k];
    h += `<div class="cardt ${cardFiltro===k?'ativo':''}" style="--c:${e.cor}" data-card="${k}">
      <div class="n">${e.nome} <small>${e.tecla}</small></div><div class="v">${brl(o.tot)}</div><div class="d">${o.n} lanç.</div></div>`;
  });
  h += `<div class="cardt pend ${cardFiltro==='PEND'?'ativo':''}" data-card="PEND"><div class="n">Falta classificar</div>
    <div class="v">${brl(total-vFeito)}</div><div class="d">${DADOS.length-feito} pagamentos</div></div>`;
  document.getElementById('cards').innerHTML = h;

  // lista
  const q = norm(document.getElementById('busca').value.trim());
  const vis = visiveis(q);
  if(foco>=vis.length) foco=Math.max(0,vis.length-1);
  const L = document.getElementById('lista');
  if(!vis.length){ L.innerHTML = `<div class="vazio">${filtro==='pend'&&!q&&!cardFiltro?'🎉 Tudo classificado! Salve o progresso ou exporte a planilha.':'Nenhum pagamento neste filtro.'}</div>`; return; }
  L.innerHTML = vis.map((d,ix)=>linha(d,ix)).join('');
}

function visiveis(q){
  return DADOS.filter(d=>{
    const ps=partesDe(d.id);
    if(cardFiltro==='PEND'){ if(ps.length) return false; }
    else if(cardFiltro){ if(!ps.some(p=>(cavDe[p.k]||p.k)===cardFiltro)) return false; }
    else if(filtro==='pend' && ps.length) return false;
    else if(filtro==='feitos' && !ps.length) return false;
    if(q && !norm(d.nome+' '+d.desc+' '+d.data+' '+fmt(d.v)+' '+d.v).includes(q)) return false;
    return true;
  });
}

function linha(d,ix){
  const ps=partesDe(d.id); const sel=ps.length===1?ps[0].k:null; const div=ps.length>1;
  let b='';
  CONJ.forEach((c,i)=>{ b+=`<button class="pl ${sel===c.cav?'on':''}" style="--c:${c.cor}" data-a="set" data-k="${c.cav}" data-id="${d.id}" title="${c.placa} · ${c.motorista}">${c.cav}<span class="k">${i+1}</span></button>`; });
  const carSel = sel && cavDe[sel] && sel!==cavDe[sel] ? sel : '';
  b+=`<select class="car" data-a="car" data-id="${d.id}" title="Lançar direto numa carreta"><option value="">Carreta…</option>${
    CONJ.map(c=>`<optgroup label="${c.cav}">${c.carretas.map(p=>`<option value="${p}" ${carSel===p?'selected':''}>${p}</option>`).join('')}</optgroup>`).join('')}</select>`;
  b+=`<span class="sep"></span>`;
  b+=`<button class="pl outro ${div?'on':''}" style="--c:#0f766e" data-a="div" data-id="${d.id}">Dividir<span class="k">D</span></button>`;
  Object.entries(EXTRA).forEach(([k,e])=>{ b+=`<button class="pl outro ${sel===k?'on':''}" style="--c:${e.cor}" data-a="set" data-k="${k}" data-id="${d.id}">${e.nome}<span class="k">${e.tecla}</span></button>`; });
  if(ps.length) b+=`<button class="pl outro" data-a="limpar" data-id="${d.id}" title="Limpar (0)">✕</button>`;
  if(d.sug && !ps.length) b+=`<button class="sug" data-a="set" data-k="${d.sug}" data-id="${d.id}" title="Motorista ${d.sugMot}">Sugestão: ${d.sug} (${d.sugMot.split(' ')[0]}) <kbd>S</kbd></button>`;
  const res = ps.length ? `<div class="res">→ ${ps.map(p=>`<span class="tag" style="--c:${corDe(p.k)}">${(EXTRA[p.k]||{}).nome||p.k}${div?' '+brl(p.v):''}</span>`).join('')}</div>` : '';
  const nota = (cls[d.id]&&cls[d.id].nota)||'';
  return `<div class="lin ${ix===foco?'foco':''} ${ps.length?'feito':''}" data-ix="${ix}" data-id="${d.id}">
    <div class="i">${d.id}</div>
    <div class="dt">${d.data.slice(0,5)}<br>${d.hora}</div>
    <div><div class="nm">${esc(d.nome)}</div><div class="ds">${esc(d.desc)||'<i>sem descrição</i>'}</div></div>
    <div class="val">${brl(d.v)}</div>
    <div class="btns">${b}</div>${res}
    <input class="nota" data-a="nota" data-id="${d.id}" placeholder="Observação (opcional)" value="${esc(nota)}">
  </div>`;
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = id => DADOS.find(d=>d.id==id);

// eventos
document.addEventListener('click',e=>{
  const card=e.target.closest('[data-card]');
  if(card){ const k=card.dataset.card; cardFiltro = cardFiltro===k?null:k; foco=0; render(); return; }
  const el=e.target.closest('[data-a]'); if(!el||el.tagName==='SELECT'||el.tagName==='INPUT') return;
  const id=+el.dataset.id, d=byId(id);
  const lin=el.closest('.lin'); if(lin) foco=+lin.dataset.ix;
  if(el.dataset.a==='set'){ const atual=partesDe(id); const k=el.dataset.k;
    setCls(id, atual.length===1&&atual[0].k===k ? [] : [{k,v:d.v}]); }
  else if(el.dataset.a==='limpar') setCls(id,[]);
  else if(el.dataset.a==='div') abrirDividir(d);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a==='car'){ const id=+el.dataset.id; if(el.value) setCls(id,[{k:el.value,v:byId(id).v}]); }
  if(el.dataset.a==='nota'){ const id=+el.dataset.id; cls[id]={partes:partesDe(id),...(cls[id]||{}),nota:el.value}; if(!el.value&&!partesDe(id).length) delete cls[id]; mudou=true; }
});
document.getElementById('busca').addEventListener('input',()=>{foco=0;render();});
document.getElementById('seg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  filtro=b.dataset.f; cardFiltro=null; foco=0;
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b)); render();
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('modal').innerHTML) { if(e.key==='Escape') fecharModal(); return; }
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  const vis=visiveis(norm(document.getElementById('busca').value.trim())); const d=vis[foco]; if(!d) return;
  const k=e.key.toUpperCase();
  const vaiProx = ()=>{ /* no filtro "pendentes" o item some e o próximo assume o foco */ if(filtro!=='pend'||cardFiltro) foco=Math.min(foco+1,vis.length-1); };
  if(e.key==='ArrowDown'||k==='J'){ foco=Math.min(foco+1,vis.length-1); render(); rolar(); e.preventDefault(); return; }
  if(e.key==='ArrowUp'||k==='K'){ foco=Math.max(foco-1,0); render(); rolar(); e.preventDefault(); return; }
  let partes=null;
  if(/^[1-8]$/.test(e.key) && CONJ[+e.key-1]) partes=[{k:CONJ[+e.key-1].cav,v:d.v}];
  else if(k==='G') partes=[{k:'GERAL',v:d.v}];
  else if(k==='N') partes=[{k:'NAO',v:d.v}];
  else if(k==='S' && d.sug) partes=[{k:d.sug,v:d.v}];
  else if(e.key==='0') { setCls(d.id,[]); return; }
  else if(k==='D') { abrirDividir(d); e.preventDefault(); return; }
  if(partes){ vaiProx(); setCls(d.id,partes); rolar(); }
});
function rolar(){ const el=document.querySelector('.lin.foco'); if(el){ const r=el.getBoundingClientRect(); const topo=document.querySelector('header').offsetHeight; if(r.top<topo+10||r.bottom>innerHeight-10) window.scrollTo({top:scrollY+r.top-topo-20,behavior:'smooth'}); } }

// dividir
function abrirDividir(d){
  const atual=partesDe(d.id); const mapa={}; atual.forEach(p=>mapa[p.k]=p.v);
  const opc=[...CONJ.map(c=>({k:c.cav,nome:c.cav+' · '+c.motorista.split(' ')[0],cor:c.cor})),{k:'GERAL',nome:'Geral / empresa',cor:EXTRA.GERAL.cor}];
  document.getElementById('modal').innerHTML = `<div class="ov" id="ov"><div class="mod">
    <h3>Dividir ${brl(d.v)}</h3><div class="sub" style="margin-bottom:8px">${esc(d.nome)} — ${esc(d.desc)}</div>
    ${opc.map(o=>`<div class="lr"><label><input type="checkbox" data-ck="${o.k}" ${mapa[o.k]!=null?'checked':''}><span class="dot" style="--c:${o.cor}"></span>${o.nome}</label>
      <input type="text" inputmode="decimal" data-vl="${o.k}" value="${mapa[o.k]!=null?fmt(mapa[o.k]):''}" placeholder="0,00"></div>`).join('')}
    <div class="rod"><div><button id="dIgual">Dividir igual</button> <button id="dResto" title="Coloca o que falta no último marcado">O resto</button></div><span class="st" id="dSt"></span></div>
    <div class="rod"><button id="dCanc">Cancelar</button><button class="pri" id="dOk">Confirmar</button></div>
  </div></div>`;
  const M=document.getElementById('modal');
  const marcados=()=>[...M.querySelectorAll('[data-ck]:checked')].map(x=>x.dataset.ck);
  const vl=k=>M.querySelector(`[data-vl="${k}"]`);
  const status=()=>{ const ks=marcados(); const s=ks.reduce((a,k)=>a+num(vl(k).value),0); const f=Math.round((d.v-s)*100)/100;
    const st=document.getElementById('dSt'); const ok=ks.length>=2&&Math.abs(f)<0.01;
    st.textContent = ks.length<2?'Marque 2 ou mais': ok?'Fechou ✓': f>0?`Falta ${brl(f)}`:`Passou ${brl(-f)}`;
    st.style.color = ok?'var(--ok)':'var(--warn)'; document.getElementById('dOk').disabled=!ok; return ok; };
  const igual=()=>{ const ks=marcados(); if(!ks.length) return; const c=Math.round(d.v*100), b=Math.floor(c/ks.length);
    ks.forEach((k,i)=>vl(k).value=fmt((i===ks.length-1?c-b*(ks.length-1):b)/100)); status(); };
  M.querySelectorAll('[data-ck]').forEach(ck=>ck.addEventListener('change',()=>{ if(!ck.checked) vl(ck.dataset.ck).value=''; igual(); }));
  let ultimo=null;
  M.querySelectorAll('[data-vl]').forEach(i=>i.addEventListener('input',()=>{ ultimo=i.dataset.vl; const ck=M.querySelector(`[data-ck="${i.dataset.vl}"]`); if(i.value&&!ck.checked) ck.checked=true; status(); }));
  document.getElementById('dIgual').onclick=igual;
  document.getElementById('dResto').onclick=()=>{ const ks=marcados(); if(ks.length<2) return;
    // completa o campo vazio (ou o que você NÃO digitou por último)
    const u=ks.find(k=>k!==ultimo&&!num(vl(k).value)) || [...ks].reverse().find(k=>k!==ultimo) || ks[ks.length-1];
    const s=ks.filter(k=>k!==u).reduce((a,k)=>a+num(vl(k).value),0); vl(u).value=fmt(Math.max(0,Math.round((d.v-s)*100)/100)); status(); };
  document.getElementById('dCanc').onclick=fecharModal;
  let downNoFundo=false;
  const ov=document.getElementById('ov');
  ov.addEventListener('mousedown',e=>downNoFundo=e.target===ov);
  ov.addEventListener('click',e=>{ if(e.target===ov&&downNoFundo) fecharModal(); });
  document.getElementById('dOk').onclick=()=>{ if(!status()) return; setCls(d.id, marcados().map(k=>({k,v:num(vl(k).value)}))); fecharModal(); };
  status();
}
function fecharModal(){ document.getElementById('modal').innerHTML=''; }

// salvar / abrir / exportar
function baixar(nome, conteudo, tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
document.getElementById('bSalvar').onclick=()=>{ baixar('classificacao-sem-placa-set2026.json', JSON.stringify({versao:1,cls},null,1),'application/json'); mudou=false; };
document.getElementById('bAbrir').onclick=()=>document.getElementById('fArq').click();
document.getElementById('fArq').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
  try{ const j=JSON.parse(await f.text()); cls=j.cls||{}; mudou=false; render(); alert('Progresso carregado: '+Object.keys(cls).length+' pagamentos classificados.'); }
  catch{ alert('Arquivo inválido.'); } e.target.value=''; };
document.getElementById('bCsv').onclick=()=>{
  const L=[['Data','Hora','Nome','Descricao','Valor do pagamento','Caminhao (cavalo)','Placa lancada','Valor atribuido','Observacao']];
  DADOS.forEach(d=>{ const ps=partesDe(d.id); const nota=(cls[d.id]&&cls[d.id].nota)||'';
    if(!ps.length) L.push([d.data,d.hora,d.nome,d.desc,fmt(d.v),'PENDENTE','','',nota]);
    ps.forEach(p=>L.push([d.data,d.hora,d.nome,d.desc,fmt(d.v),(EXTRA[p.k]||{}).nome||cavDe[p.k],EXTRA[p.k]?'':p.k,fmt(p.v),nota])); });
  L.push([]); L.push(['RESUMO']);
  const {t}=totais(); CONJ.forEach(c=>L.push(['','','',c.cav+' ('+c.placa+')','','','',fmt(t[c.cav].tot)]));
  Object.entries(EXTRA).forEach(([k,e])=>L.push(['','','',e.nome,'','','',fmt(t[k].tot)]));
  const csv='﻿'+L.map(r=>r.map(x=>{x=String(x??''); return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(';')).join('\r\n');
  baixar('classificacao-sem-placa-set2026.csv',csv,'text/csv;charset=utf-8');
};
window.addEventListener('beforeunload',e=>{ if(mudou){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
