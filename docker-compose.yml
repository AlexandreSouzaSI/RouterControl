services:
  postgres_rota:
    image: postgres:15
    container_name: postgres_rota
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viagens_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_rota_data:/var/lib/postgresql/data

volumes:
  postgres_rota_data: